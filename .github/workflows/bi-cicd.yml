name: BI pipeline & report deploy

# Runs the ETL, validates its outputs and publishes the D3 report to GitHub Pages.
#
# Triggers:
#   - push to main touching ETL / data / report / workflow files
#   - manual run from the Actions tab ("Run workflow")
#   - monthly schedule (keeps the site warm; only useful if data/pipeline change)
on:
  push:
    branches: [main]
    paths:
      - "etl/**"
      - "data/**"
      - "report/**"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *" # 1st of the month, 06:00 UTC

permissions:
  contents: read

# One deployment at a time; a newer run cancels an in-flight older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  etl:
    name: Extract · Transform · Load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Run ETL pipeline
        run: python etl/pipeline.py

      - name: Validate report data
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          files = sorted(glob.glob("report/data/*.json"))
          assert len(files) >= 10, f"expected >=10 JSON files, found {len(files)}"
          for f in files:
              with open(f) as fh:
                  payload = json.load(fh)
              assert payload not in (None, [], {}), f"{f} is empty"
          assert os.path.exists("report/index.html"), "report entry point missing"
          print(f"Validation OK: {len(files)} data files + index.html present")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: report/

  deploy:
    name: Deploy to GitHub Pages
    needs: etl
    runs-on: ubuntu-latest
    permissions:
      pages: write # upload the deployment
      id-token: write # OIDC token for Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
